name: Deploy Three.js app to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "ThreeJS/**"
      - "Assets/microban_hold.stl"
      - "Assets/cube_hold.stl"
      - "Assets/sidehpull_hold.stl"
      - "Assets/fingerpocket_hold.stl"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p _site/Assets
          cp -R ThreeJS _site/ThreeJS
          cp Assets/microban_hold.stl Assets/cube_hold.stl Assets/sidehpull_hold.stl Assets/fingerpocket_hold.stl _site/Assets/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
