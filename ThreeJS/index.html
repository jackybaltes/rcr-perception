<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10161b">
    <title>RCR Climbing Wall</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="toolbar">
        <div class="brand">
          <span class="eyebrow">RCR PERCEPTION</span>
          <h1>Climbing wall</h1>
        </div>
        <form id="scene-controls" class="controls">
          <label>
            Seed
            <input id="seed" type="number" value="42" step="1">
          </label>
          <label>
            Holds
            <input id="hold-count" type="number" value="10" min="0" max="30" step="1">
          </label>
          <button id="regenerate" type="submit">Regenerate scene</button>
        </form>
      </header>
      <section class="viewport" aria-label="Interactive 3D climbing wall">
        <canvas id="scene"></canvas>
        <div id="status" class="status" role="status">Preparing scene…</div>
        <div class="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
      </section>
    </main>
  </body>
</html>
